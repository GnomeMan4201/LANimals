name: One-shot collector-state patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/explicit-collector-failure-state
      - name: Apply exact collector-state transformation
        run: python tools/_one_shot_patch_collectors.py
      - name: Verify dependency-free collector regressions
        run: python -m unittest tests.test_collector_failures.CollectorCommandTests -v
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/nexus_collectors.py
          git diff --cached --check
          git commit -m "Distinguish collector failures from zero results"
          git push origin HEAD:agent/explicit-collector-failure-state
