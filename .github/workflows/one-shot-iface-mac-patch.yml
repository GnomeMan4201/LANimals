name: One-shot local-interface MAC patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-local-interface-mac
      - name: Apply exact import fix
        run: python tools/_one_shot_patch_iface_mac.py
      - name: Verify focused MAC regressions
        run: python -m unittest tests.test_local_interface_mac -v
      - name: Commit exact source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/nexus_collectors.py
          git diff --cached --check
          git commit -m "Fix local-interface MAC collection"
          git push origin HEAD:agent/fix-local-interface-mac
