name: Operator lifecycle hardening

on:
  push:
    branches: [ agent/operator-lifecycle-hardening ]
    paths:
      - scripts/apply_operator_lifecycle_hardening.py
      - .github/workflows/operator-lifecycle-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-lifecycle-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nmap net-tools iproute2

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Harden patcher replacement semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_operator_lifecycle_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = 'rendered, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'rendered, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)'
          if text.count(old) != 1:
              raise SystemExit('patcher regex helper source drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply fail-closed patch
        run: python scripts/apply_operator_lifecycle_hardening.py

      - name: Run focused regression tests
        run: |
          pytest tests/test_operator_lifecycle.py tests/test_api_contracts.py tests/test_capability_manifest.py tests/test_product_identity.py -v --tb=short

      - name: Run appliance smoke test
        run: bash scripts/smoke_appliance.sh

      - name: Commit verified changes
        run: |
          rm scripts/apply_operator_lifecycle_hardening.py
          rm .github/workflows/operator-lifecycle-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden operator UI and evidence lifecycle'
          git push origin HEAD:agent/operator-lifecycle-hardening
