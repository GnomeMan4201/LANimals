name: Phone touch QA patch

on:
  push:
    branches: [agent/phone-touch-qa]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phone-touch-qa
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nmap net-tools iproute2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply fail-closed phone patch
        run: python scripts/apply_phone_touch_qa.py

      - name: Verify focused public console contracts
        run: pytest tests/test_public_pages_console.py -v --tb=short

      - name: Verify full repository suite
        run: pytest tests/ -v --tb=short

      - name: Smoke-test local appliance
        run: bash scripts/smoke_appliance.sh

      - name: Smoke-test fresh operator journey
        run: bash scripts/smoke_operator_journey.sh

      - name: Commit only verified permanent changes
        run: |
          git rm scripts/apply_phone_touch_qa.py .github/workflows/phone-touch-qa.yml
          git add docs/app.css docs/app.js tests/test_public_pages_console.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make LANimals phone controls thumb-safe"
          git push origin HEAD:agent/phone-touch-qa
