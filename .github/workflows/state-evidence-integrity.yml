name: State evidence integrity hardening

on:
  push:
    branches: [ agent/state-evidence-integrity ]
    paths:
      - scripts/apply_state_evidence_integrity.py
      - .github/workflows/state-evidence-integrity.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/state-evidence-integrity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nmap net-tools iproute2

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply fail-closed integrity patch
        run: python scripts/apply_state_evidence_integrity.py

      - name: Keep empty graph reads storage-independent
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('core/nexus_builder.py')
          text = path.read_text(encoding='utf-8')
          patterns = [
              (
                  r'(def _overlay_persisted_host_state\(nodes: Dict\[str, GraphNode\]\) -> None:\n\s+from core\.nexus_db import get_all_hosts\n\n)(\s+persisted = \{row\["ip"\]: row for row in get_all_hosts\(\)\})',
                  r'\1    if not nodes:\n        return\n\2',
              ),
              (
                  r'(def _generate_state_events\(nodes: Dict\[str, GraphNode\]\) -> List\[GraphEvent\]:\n\s+"""Compatibility helper: graph reads expose durable events and never mutate state\."""\n)(\s+return _durable_graph_events\(\))',
                  r'\1    if not nodes:\n        return []\n\2',
              ),
          ]
          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit('builder empty-state structure drifted')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run integrity regressions
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_state_evidence_integrity.py tests/test_contracts.py tests/test_operator_lifecycle.py tests/test_api_contracts.py tests/test_capability_manifest.py tests/test_product_identity.py -v --tb=short

      - name: Run full test suite
        env:
          PYTHONPATH: .
        run: pytest -v --tb=short

      - name: Run appliance smoke test
        run: bash scripts/smoke_appliance.sh

      - name: Commit verified changes
        run: |
          rm scripts/apply_state_evidence_integrity.py
          rm .github/workflows/state-evidence-integrity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make LANimals state and evidence consistent'
          git push origin HEAD:agent/state-evidence-integrity
