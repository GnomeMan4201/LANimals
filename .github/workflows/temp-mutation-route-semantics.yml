name: Temporary mutation route semantics verifier

on:
  push:
    branches:
      - agent/mutation-route-semantics

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/mutation-route-semantics
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nmap net-tools iproute2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply fail-closed patch
        run: python scripts/apply_mutation_route_semantics.py
      - name: Run focused semantic contracts
        run: |
          pytest tests/test_operator_lifecycle.py tests/test_browser_contract.py tests/test_site_capability_contract.py -v --tb=short
      - name: Run full repository suite
        run: pytest tests/ -v --tb=short
      - name: Smoke local appliance
        run: bash scripts/smoke_appliance.sh
      - name: Smoke fresh operator journey
        run: bash scripts/smoke_operator_journey.sh
      - name: Commit verified product changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/apply_mutation_route_semantics.py
          rm .github/workflows/temp-mutation-route-semantics.yml
          git add core/nexus_api.py ui/lanimals_live_map.html scripts/smoke_operator_journey.sh tests/test_operator_lifecycle.py tests/test_browser_contract.py tests/test_site_capability_contract.py site_capabilities.json docs/SITES_HANDOFF.md docs/BROWSER_RUNTIME_CONTRACT.md README.md
          git add -u scripts/apply_mutation_route_semantics.py .github/workflows/temp-mutation-route-semantics.yml
          git diff --cached --check
          git commit -m 'Make side-effecting API actions explicit mutations'
          git push origin HEAD:agent/mutation-route-semantics
